server.port=8082

spring.application.name=account-service

spring.datasource.url=jdbc:postgresql://localhost:5432/banking?currentSchema=account
spring.datasource.username=banking
spring.datasource.password=banking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=account
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=account
spring.flyway.default-schema=account
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs

app.jwt.secret=${JWT_SECRET:ZmFzdC1kZXYtc2VjcmV0LWtleS1mb3ItYmFua2luZy1hdXRoLXNlcnZpY2UtMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.internal.secret=${INTERNAL_SECRET:banking-internal-dev-secret}

