spring.datasource.url=jdbc:postgresql://localhost:5432/banking?currentSchema=auth
spring.datasource.username=banking
spring.datasource.password=banking

spring.flyway.create-schemas=true

app.jwt.secret=test-jwt-secret-key-for-banking-auth-service-tests-only
app.jwt.expiration-ms=3600000

app.kafka.enabled=false

app.redis.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

