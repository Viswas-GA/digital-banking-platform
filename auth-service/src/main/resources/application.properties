server.port=8081

spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://localhost:5432/banking?currentSchema=auth
spring.datasource.username=banking
spring.datasource.password=banking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.jwt.secret=${JWT_SECRET:ZmFzdC1kZXYtc2VjcmV0LWtleS1mb3ItYmFua2luZy1hdXRoLXNlcnZpY2UtMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

app.kafka.enabled=${KAFKA_ENABLED:true}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.redis.enabled=${REDIS_ENABLED:true}

app.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX:5}
app.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

