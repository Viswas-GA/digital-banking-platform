server.port=8080

spring.application.name=api-gateway

management.endpoints.web.exposure.include=health,info,gateway

app.services.auth=http://localhost:8081
app.services.account=http://localhost:8082
app.services.transaction=http://localhost:8083
app.services.notification=http://localhost:8084
app.services.audit=http://localhost:8085

# Auth + KYC -> auth-service (8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${app.services.auth}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=kyc-service
spring.cloud.gateway.routes[1].uri=${app.services.auth}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/kyc/**

# Accounts -> account-service (8082) — internal paths excluded from public gateway
spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=${app.services.account}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/accounts/**

# Transactions, beneficiaries, scheduled transfers -> transaction-service (8083)
spring.cloud.gateway.routes[3].id=transaction-service
spring.cloud.gateway.routes[3].uri=${app.services.transaction}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/transactions/**

spring.cloud.gateway.routes[4].id=beneficiary-service
spring.cloud.gateway.routes[4].uri=${app.services.transaction}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/beneficiaries/**

spring.cloud.gateway.routes[5].id=scheduled-transfer-service
spring.cloud.gateway.routes[5].uri=${app.services.transaction}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/scheduled-transfers/**

# Notifications -> notification-service (8084)
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=${app.services.notification}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/notifications/**

# Audit logs -> audit-service (8085) — admin only
spring.cloud.gateway.routes[7].id=audit-service
spring.cloud.gateway.routes[7].uri=${app.services.audit}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/admin/audit-logs/**
