server.port=8084

spring.application.name=notification-service

spring.datasource.url=jdbc:postgresql://localhost:5432/banking?currentSchema=notification
spring.datasource.username=banking
spring.datasource.password=banking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notification
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs

app.jwt.secret=${JWT_SECRET:ZmFzdC1kZXYtc2VjcmV0LWtleS1mb3ItYmFua2luZy1hdXRoLXNlcnZpY2UtMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

app.kafka.enabled=${KAFKA_ENABLED:true}
